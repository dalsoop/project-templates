stages:
  - test

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

quality:
  stage: test
  image: composer:2
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/composer
      - vendor/
  before_script:
    - apk add --no-cache php83 php83-phar php83-openssl php83-mbstring php83-tokenizer php83-xml php83-xmlwriter php83-session php83-dom php83-pdo_sqlite php83-sqlite3 php83-ctype php83-fileinfo php83-pdo
    - ln -sf /usr/bin/php83 /usr/bin/php
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - cp .env.example .env
    - php artisan key:generate
  script:
    - composer analyse
    - composer lint
    - DB_CONNECTION=sqlite DB_DATABASE=':memory:' composer test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
