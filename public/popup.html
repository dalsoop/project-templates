<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infocutter</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <p class="popup__eyebrow">Infocutter Template</p>
        <h1 class="popup__title">DOM Hider</h1>
      </header>

      <section class="popup__panel">
        <p id="site-label" class="popup__site">Loading active site...</p>
        <p id="rule-count" class="popup__meta">0 saved selectors</p>
      </section>

      <section class="popup__actions">
        <button id="pick-button" type="button">Hide element on this site</button>
        <button id="refresh-button" type="button" class="popup__secondary">Refresh</button>
        <button id="clear-button" type="button" class="popup__danger">Clear site rules</button>
      </section>

      <p id="status" class="popup__status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="../src/popup/index.js"></script>
  </body>
</html>
